name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag rilis APK (opsional, mis. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Build web assets
        env:
          VITE_API_BASE_URL: ${{ vars.ERTO_SERVER_URL || '' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ERTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ERTO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'erto' }}
          ERTO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Set a persistent ANDROID_KEYSTORE_BASE64 secret before releasing. A generated temporary key prevents updates to installed APKs and changes the Google OAuth SHA-1."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        env:
          ERTO_KEYSTORE_PATH: release.keystore
          ERTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ERTO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'erto' }}
          ERTO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner tidak ditemukan di Android SDK"
            exit 1
          fi
          for APK_FILE in android/app/build/outputs/apk/release/*.apk; do
            [ -f "$APK_FILE" ] || continue
            "$APKSIGNER" verify --verbose "$APK_FILE"
          done

      - name: Rename Split APKs
        id: apk_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version_tag }}" ]; then
            TAG_NAME="${{ inputs.version_tag }}"
          else
            TAG_NAME="v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          : > release_files.txt
          for APK_SRC in android/app/build/outputs/apk/release/*.apk; do
            [ -f "$APK_SRC" ] || continue
            APK_BASE="$(basename "$APK_SRC")"
            ABI="$(printf '%s' "$APK_BASE" | sed -E 's/^app-(.+)-release\.apk$/\1/')"
            if [ "$ABI" = "$APK_BASE" ]; then ABI="universal"; fi
            APK_DEST="Erto-Browser-${TAG_NAME}-${ABI}.apk"
            cp "$APK_SRC" "$APK_DEST"
            echo "$APK_DEST" >> release_files.txt
          done
          if [ ! -s release_files.txt ]; then
            echo "APK split tidak ditemukan. Isi folder output:"
            find android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "apk_files=$(paste -sd ' ' release_files.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload Split APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: erto-browser-apks
          path: Erto-Browser-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_meta.outputs.tag_name }}
          name: "Erto Browser ${{ steps.apk_meta.outputs.tag_name }}"
          body: |
            Rilis resmi **Erto Browser Android APK** (`com.erto.browser`), dipisah per ABI agar ukuran unduhan lebih kecil.

            ### Cara Instal di Android:
            1. Unduh `arm64-v8a` untuk hampir semua ponsel modern; pilih `armeabi-v7a` hanya untuk perangkat ARM 32-bit lama.
            2. Buka APK yang sesuai di ponsel Android dan izinkan instalasi dari sumber ini.
            3. Buka **Erto Browser**. Katalog memasang add-on AMO/XPI yang kompatibel melalui GeckoView; paket CRX Chrome tidak dapat dipasang langsung.
          files: |
            Erto-Browser-*.apk
          draft: false
          prerelease: false
